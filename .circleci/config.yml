version: 2.1

orbs:
  aws-cli: circleci/aws-cli@1.3.0
  awscli-windows: sensu/awscli-windows@1.0.0
  cmake: sensu/cmake@1.0.0
  docker: circleci/docker@1.4.0
  signtool: sensu/signtool@1.0.0
  windows: circleci/windows@2.4.0
  wixtoolset: sensu/wixtoolset@1.0.0

parameters:
  target_workflow:
    type: string
    default: ""
  publish:
    type: boolean
    default: false
  sensu_release_version:
    type: string
    default: fa03bf83bef1df882e5c75dc611a186cb0eae5e0

executors:
  packagecloud-pruner:
    docker:
      - image: sensu/sensu-release:<< pipeline.parameters.sensu_release_version >>-packagecloud-pruner
        auth:
          username: $DOCKER_USERNAME
          password: $DOCKER_PASSWORD

commands:
  create-target-directory:
    steps:
      - run:
          name: Create target directory
          command: mkdir -pv target
  setenv-from-file:
    parameters:
      variable-name:
        type: env_var_name
      path:
        type: string
    steps:
      - run:
          name: Set << parameters.variable-name >> environment variable
          command: >
            echo "export
            << parameters.variable-name >>=$(cat << parameters.path >> | tr -d
            '\n')" >> $BASH_ENV
      - run:
          name: Ensure << parameters.variable-name >> is set
          command: |
            if [ "x${<< parameters.variable-name >>}" = "x" ]; then
            echo "<< parameters.variable-name >> is empty"
            exit 1
            fi
      - run:
          name: Print << parameters.variable-name >>
          command: echo $<< parameters.variable-name >>
  setenv-target-workflow:
    parameters:
      branch:
        type: string
        default: "develop/6"
    steps:
      - when:
          condition: << pipeline.parameters.target_workflow >>
          steps:
            - run:
                name: Set TARGET_WORKFLOW environment variable
                command: >
                  echo 'export
                  TARGET_WORKFLOW=<< pipeline.parameters.target_workflow >>'
                  >> $BASH_ENV
      - when:
          condition:
            not: << pipeline.parameters.target_workflow >>
          steps:
            - run:
                name: Find target workflow for << parameters.branch >> branch
                environment:
                  TARGET_BRANCH: << parameters.branch >>
                command: |
                  ./scripts/find-branch-workflow.sh > workflow
                  echo 'export TARGET_WORKFLOW="'$(cat workflow)'"' >> $BASH_ENV
      - run:
          name: Ensure TARGET_WORKFLOW is set
          command: |
            if [ "x$TARGET_WORKFLOW" = "x" ]; then
            echo "TARGET_WORKFLOW is empty"
            exit 1
            fi
      - run:
          name: Print TARGET_WORKFLOW
          command: echo $TARGET_WORKFLOW
  linux-amd64-only:
    parameters:
      target:
        type: string
      steps:
        type: steps
    steps:
      - when:
          condition:
            equal: [<< parameters.target >>, "linux_amd64"]
          steps: << parameters.steps >>
  backend-platforms-only:
    parameters:
      target:
        type: string
      steps:
        type: steps
    steps:
      - when:
          condition:
            or:
              - equal: [<< parameters.target >>, "linux_amd64"]
              - equal: [<< parameters.target >>, "linux_arm64"]
              - equal: [<< parameters.target >>, "linux_ppc64le"]
          steps: << parameters.steps >>
  fetch-job-artifacts:
    description: Fetches a job artifacts for a given workflow & job name
    parameters:
      workflow:
        type: string
        default: "$TARGET_WORKFLOW"
      job:
        type: string
      destination:
        type: string
        default: "target"
      filter:
        type: string
        default: ""
    steps:
      - run:
          name: >
            Fetch artifacts for << parameters.job >> with filter:
            << parameters.filter >>
          command: >
            ./scripts/circleci-fetch-artifacts.sh << parameters.workflow >>
            << parameters.job >> << parameters.destination >>
            << parameters.filter >>
  setup-metadata:
    description: Fetches metadata files and sets environment variables
    parameters:
      target:
        type: string
    steps:
      - fetch-job-artifacts:
          filter: "commit-date"
          job: build-<< parameters.target >>
      - fetch-job-artifacts:
          filter: "version"
          job: build-<< parameters.target >>
      - fetch-job-artifacts:
          filter: "build-number"
          job: build-<< parameters.target >>
      - fetch-job-artifacts:
          filter: "git-revision"
          job: build-<< parameters.target >>
      - fetch-job-artifacts:
          filter: "git-branch"
          job: build-<< parameters.target >>
      - setenv-from-file:
          variable-name: COMMIT_DATE
          path: target/commit-date
      - setenv-from-file:
          variable-name: SENSU_VERSION
          path: target/version
      - setenv-from-file:
          variable-name: BUILD_NUMBER
          path: target/build-number
      - setenv-from-file:
          variable-name: TARGET_REVISION
          path: target/git-revision
      - setenv-from-file:
          variable-name: TARGET_BRANCH
          path: target/git-branch
  install-msbuildtasks:
    description: Installs MSBuildTasks from Chocolatey
    steps:
      - run:
          name: Kill existing msiexec processes
          shell: powershell.exe
          command: |
            $msi = Get-Process msiexec -ErrorAction SilentlyContinue

            if ($msi) {
              Write-Host "Stopping existing msiexec processes..."

              $msi | Stop-Process -Force

              Start-Sleep -Seconds 5
            }

            Write-Host "Continuing installation..."
      - run:
          name: Install MSBuild.CommunityTasks
          command: choco.exe install -y MSBuild.CommunityTasks
  extract-tarballs:
    description: Extracts all tarballs in a given directory
    parameters:
      working_directory:
        type: string
      find_command:
        type: string
        default: "find"
    steps:
      - run:
          name: Extract tarballs in << parameters.working_directory >>
          working_directory: << parameters.working_directory >>
          command: |
            << parameters.find_command >> -name '*.tar.gz' -type f -exec tar -zxf {} \;
      - run:
          name: Debug extracted Windows 386 files
          shell: powershell.exe
          command: |
            Get-ChildItem -Path target/windows_386 -Recurse
      - run:
          name: Debug extracted Windows amd64 files
          shell: powershell.exe
          command: |
            Get-ChildItem -Path target/windows_amd64 -Recurse
  verify-binary:
    parameters:
      working_directory:
        type: string
      binary:
        type: string
    steps:
      - run:
          name: Verify file type of << parameters.working_directory >>/<< parameters.binary >>
          working_directory: << parameters.working_directory >>
          command: |
            if ! file << parameters.binary >> | grep executable; then
              file << parameters.binary >>
              cat << parameters.binary >>
            fi
  install-system-deps:
    steps:
      - run:
          name: Install file
          command: |
            sudo apt-get update && sudo apt-get install -y \
              file;
  verify-version:
    parameters:
      working_directory:
        type: string
      binary:
        type: string
    steps:
      - run:
          name: Print version of << parameters.working_directory >>/<< parameters.binary >>
          working_directory: << parameters.working_directory >>
          command: ./<< parameters.binary >> version
      - run:
          name: Verify version of << parameters.working_directory >>/<< parameters.binary >>
          working_directory: << parameters.working_directory >>
          command: >
            ./<< parameters.binary >> version | grep "${SENSU_VERSION}+"
  build-msi:
    parameters:
      working_directory:
        type: string
      arch:
        description: The architecture of the MSI package to build.
        type: string
        default: x64
    steps:
      - run:
          name: Create MSI packages for << parameters.arch >> platform
          working_directory: << parameters.working_directory >>
          command: msbuild.exe -property:Platform=<< parameters.arch >>
  packagecloudgo:
    steps:
      - run:
          name: Download packagecloud-go tool
          command: |
            baseURL="https://github.com/amdprophet/packagecloud-go/releases/download"
            version="0.1.2"
            file="packagecloud-go_${version}_linux_amd64.tar.gz"
            curl -Lo /tmp/packagecloud-go.tar.gz $baseURL/$version/$file
      - run:
          name: Install packagecloud-go tool
          command: |
            tar -C /tmp -zxf /tmp/packagecloud-go.tar.gz
            sudo mv /tmp/packagecloud /usr/local/bin
  install-log-collector-linux:
    steps:
      - run:
          name: Download circleci-logs tool
          command: |
            version="74baa1cd0c959bb05de3f587ea978ef82b6612d5"
            baseURL="https://s3-us-west-2.amazonaws.com/sensu.io"
            filename="circleci-logs-${version}.linux_amd64.tar.gz"
            curl -Lo /tmp/circleci-logs.tar.gz ${baseURL}/${filename}
      - run:
          name: Install circleci-logs tool
          command: sudo tar -C /usr/local/bin -zxf /tmp/circleci-logs.tar.gz
  install-log-collector-windows:
    steps:
      - run: mkdir -pv ~/bin
      - run: echo 'export PATH="$PATH:$HOME/bin"' >> $BASH_ENV
      - run: |
          version="74baa1cd0c959bb05de3f587ea978ef82b6612d5"
          baseURL="https://s3-us-west-2.amazonaws.com/sensu.io"
          filename="circleci-logs-${version}.windows_amd64.tar.gz"
          curl -Lo c:/tmp/circleci-logs.tar.gz ${baseURL}/${filename}
      - run: tar -C ~/bin -zxf c:/tmp/circleci-logs.tar.gz
  fetch-logs:
    description: "Collect logs for the current job"
    parameters:
      binary:
        type: string
        default: "circleci-logs"
      destination:
        type: string
        default: "/tmp/artifacts/s3/logs"
    steps:
      - run:
          name: "Wait 10 seconds before attempting to collect logs"
          command: sleep 10
      - run:
          name: "Create destination logs directory"
          command: mkdir -pv << parameters.destination >>
      - run: >
          << parameters.binary >> fetch -t $CIRCLE_TOKEN
          -o << parameters.destination >>/$CIRCLE_JOB.txt
  gather-artifacts:
    description: "Gather artifacts and copy them to the artifact directories"
    parameters:
      find_command:
        type: string
        default: "find"
      source:
        type: string
      destination:
        type: string
      filename:
        type: string
    steps:
      - run: mkdir -pv << parameters.destination >>
      - run: >
          << parameters.find_command >>
          << parameters.source >>
          -type f
          -name "<< parameters.filename >>"
          -exec cp {} << parameters.destination >> \;
  upload-artifacts-to-s3:
    description: "Upload artifacts to Amazon S3"
    parameters:
      find_command:
        type: string
        default: "find"
      source:
        type: string
        default: "/tmp/artifacts/s3"
    steps:
      - run:
          name: Upload artifacts to Amazon S3
          environment:
            FIND_CMD: << parameters.find_command >>
          command: >
            ./scripts/post-packages-s3.sh
            << parameters.source >>
            $TARGET_BRANCH
            $TARGET_REVISION
  setup-wixtool-set:
    steps:
      - wixtoolset/download:
          installer_url: https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314.exe
      - wixtoolset/install
jobs:
  build-linux-packages:
    docker:
      - image: cimg/python:3.8
        auth:
          username: $DOCKER_USERNAME
          password: $DOCKER_PASSWORD
    parameters:
      target:
        type: string
      destination:
        type: string
    environment:
      TARGET_PLATFORM: << parameters.target >>
    steps:
      - checkout
      - create-target-directory
      - setenv-target-workflow
      - setup-metadata:
          target: << parameters.target >>
      - run: sudo apt update
      - run:
          name: Install RPM tools
          command: sudo apt install rpm
      - packagecloudgo
      - cmake/install
      - install-log-collector-linux
      - aws-cli/install
      - install-system-deps
      - fetch-job-artifacts:
          filter: ".tar.gz"
          job: build-<< parameters.target >>
          destination: << parameters.destination >>
      - extract-tarballs:
          working_directory: << parameters.destination >>
      - backend-platforms-only:
          target: << parameters.target >>
          steps:
            - verify-binary:
                working_directory: << parameters.destination >>
                binary: sensu-backend
      - verify-binary:
          working_directory: << parameters.destination >>
          binary: sensu-agent
      - verify-binary:
          working_directory: << parameters.destination >>
          binary: sensuctl
      - linux-amd64-only:
          target: << parameters.target >>
          steps:
            - verify-version:
                working_directory: << parameters.destination >>
                binary: sensu-agent
            - verify-version:
                working_directory: << parameters.destination >>
                binary: sensu-backend
            - verify-version:
                working_directory: << parameters.destination >>
                binary: sensuctl
      - run:
          name: Run CMake
          working_directory: ../obj
          command: env && cmake $CIRCLE_WORKING_DIRECTORY
      - run:
          name: Build templates
          working_directory: ../obj
          command: make VERBOSE=1
      - run:
          name: Build packages
          working_directory: ../obj
          command: make sensu-packages VERBOSE=1
      - run:
          name: Test packages
          working_directory: ../obj
          command: make test-sensu-packages VERBOSE=1
      - gather-artifacts:
          filename: "*.deb"
          source: "../obj"
          destination: "/tmp/artifacts/s3/build/deb"
      - gather-artifacts:
          filename: "*.rpm"
          source: "../obj"
          destination: "/tmp/artifacts/s3/build/rpm"
      - gather-artifacts:
          filename: "*.deb"
          source: "../obj"
          destination: "/tmp/artifacts/circleci"
      - gather-artifacts:
          filename: "*.rpm"
          source: "../obj"
          destination: "/tmp/artifacts/circleci"
      - store_artifacts:
          path: "/tmp/artifacts/circleci"
          destination: "."
      - when:
          condition: << pipeline.parameters.publish >>
          steps:
            - run:
                name: Publish pack
                working_directory: ../obj
                command: make publish-sensu-packages VERBOSE=1
            - fetch-logs
            - upload-artifacts-to-s3
  build-windows-packages:
    executor:
      name: windows/default
      shell: bash.exe -eo pipefail
    parameters:
      package_name:
        type: string
      binary:
        type: string
    steps:
      - checkout
      - awscli-windows/download-and-install
      - install-msbuildtasks
      - create-target-directory
      - setenv-target-workflow
      - setup-metadata:
          target: windows_amd64
      - install-log-collector-windows
      - fetch-job-artifacts:
          filter: ".tar.gz"
          job: build-windows_386
          destination: target/windows_386
      - fetch-job-artifacts:
          filter: ".tar.gz"
          job: build-windows_amd64
          destination: target/windows_amd64
      - extract-tarballs:
          working_directory: target/windows_386
          find_command: /bin/find
      - extract-tarballs:
          working_directory: target/windows_amd64
          find_command: /bin/find
      - verify-binary:
          working_directory: target/windows_386
          binary: << parameters.binary >>
      - verify-binary:
          working_directory: target/windows_amd64
          binary: << parameters.binary >>
      - setup-wixtool-set
      # DigiCert KeyLocker/Signing Manager integration
      - run:
          name: Validate DigiCert environment variables
          shell: powershell.exe
          command: |
            $required = @(
              'SM_HOST',
              'SM_API_KEY',
              'SM_CLIENT_CERT_FILE_B64',
              'SM_CLIENT_CERT_PASSWORD',
              'SM_KEYPAIR_ALIAS'
            )

            foreach ($var in $required) {

              $value = [Environment]::GetEnvironmentVariable($var)

              if ([string]::IsNullOrEmpty($value)) {
                Write-Host "ERROR: $var is not set"
                exit 1
              }
            }

            Write-Host "All DigiCert env vars are set."
      - run:
          name: Decode and save DigiCert client certificate
          shell: powershell.exe
          command: |
            $certContent = $env:SM_CLIENT_CERT_FILE_B64
            $decodedContent = [System.Convert]::FromBase64String($certContent)
            $certPath = "C:\\Temp\\DigiCert\\certificate.pfx"
            New-Item -ItemType Directory -Force -Path "C:\\Temp\\DigiCert" | Out-Null
            [System.IO.File]::WriteAllBytes($certPath, $decodedContent)
            Write-Host "Client certificate saved to: $certPath"
      - run:
          name: Create PKCS#11 configuration file
          shell: powershell.exe
          command: |
            $pkcs11Config = @"
            name=signingmanager
            library=C:\\Program Files\\DigiCert\\DigiCert One Signing Manager Tools\\smpkcs11.dll
            slotListIndex=0
            "@
            $configPath = "C:\\Temp\\DigiCert\\pkcs11properties.cfg"
            Set-Content -Path $configPath -Value $pkcs11Config -Encoding ASCII
            Write-Host "PKCS#11 configuration created at: $configPath"
      - run:
          name: Download DigiCert Signing Manager Tools
          shell: powershell.exe
          command: |
            $smToolsUrl = "https://one.digicert.com/signingmanager/api-ui/v1/releases/smtools-windows-x64.msi/download"
            $msiPath = "C:\\Temp\\DigiCert\\smtools-windows-x64.msi"
            Write-Host "Downloading DigiCert tools from: $smToolsUrl"
            curl.exe -L -H "x-api-key:$env:SM_API_KEY" -o $msiPath $smToolsUrl
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Failed to download DigiCert tools"
              exit 1
            }
            Write-Host "DigiCert tools downloaded to: $msiPath"
      - run:
          name: Install DigiCert Signing Manager Tools
          shell: powershell.exe
          command: |
            $msiPath = "C:\\Temp\\DigiCert\\smtools-windows-x64.msi"
            Write-Host "Installing DigiCert Signing Manager Tools..."
            Start-Process msiexec.exe `
            -ArgumentList "/i `"$msiPath`" /qn /norestart" `
            -Wait
            Start-Sleep -Seconds 5
            $smctlPath = "C:\\Program Files\\DigiCert\\DigiCert One Signing Manager Tools\\smctl.exe"
            if (Test-Path $smctlPath) {
              Write-Host "DigiCert tools installed successfully"
              Write-Host "SMCTL location: $smctlPath"
            } else {
              Write-Host "ERROR: DigiCert tools installation failed"
              exit 1
            }
      - run:
          name: Locate signtool.exe
          shell: powershell.exe
          command: |
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if (-not $signtool) {
              Write-Host "ERROR: signtool.exe not found"
              exit 1
            }

            Write-Host "Found signtool: $($signtool.FullName)"

            Add-Content $env:BASH_ENV "export PATH=`"$($signtool.Directory.FullName);`$PATH`""
      - run:
          name: Wait after DigiCert install
          shell: powershell.exe
          command: |
            Start-Sleep -Seconds 20
      - run:
          name: Verify DigiCert installation
          shell: powershell.exe
          command: |
            $smctlPath = "C:\\Program Files\\DigiCert\\DigiCert One Signing Manager Tools\\smctl.exe"

            & $smctlPath healthcheck

            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: smctl not working"
              exit 1
            }

            Write-Host "DigiCert Signing Manager installed successfully"
      - run:
          name: Persist DigiCert environment variables
          shell: powershell.exe
          command: |
            Add-Content $env:BASH_ENV 'export SM_HOST="https://clientauth.one.digicert.com"'
            Add-Content $env:BASH_ENV 'export SM_CLIENT_CERT_FILE="C:\\Temp\\DigiCert\\certificate.pfx"'
            Add-Content $env:BASH_ENV 'export PKCS11_CONFIG="C:\\Temp\\DigiCert\\pkcs11properties.cfg"'
            Add-Content $env:BASH_ENV 'export PATH="$PATH:/c/Program Files/DigiCert/DigiCert One Signing Manager Tools"'

            Write-Host "DigiCert environment variables persisted"
      - run:
          name: Sync DigiCert certificates
          shell: powershell.exe
          command: |
            $smctlPath = "C:\\Program Files\\DigiCert\\DigiCert One Signing Manager Tools\\smctl.exe"

            & $smctlPath windows certsync --keypair-alias="$env:SM_KEYPAIR_ALIAS"

            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: DigiCert certsync failed"
              exit 1
            }

            Write-Host "DigiCert certificate sync completed"
      - run:
          name: Debug extracted Windows 386 files
          shell: powershell.exe
          command: |
            Get-ChildItem -Path target/windows_386 -Recurse
      - run:
          name: Sign Windows 386 binary with DigiCert
          shell: powershell.exe
          command: |
            $smctlPath = "C:\\Program Files\\DigiCert\\DigiCert One Signing Manager Tools\\smctl.exe"
            $filePath = "target/windows_386/<< parameters.binary >>"
            $keypairAlias = $env:SM_KEYPAIR_ALIAS
            Write-Host "Signing $filePath with DigiCert KeyLocker..."

            & $smctlPath sign `
              --keypair-alias "$keypairAlias" `
              --input "$filePath" `
              --tool signtool `
              --verbose

            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Signing failed for $filePath"
              exit 1
            }
            Write-Host "Successfully signed: $filePath"
      - run:
          name: Sign Windows amd64 binary with DigiCert
          shell: powershell.exe
          command: |
            $smctlPath = "C:\\Program Files\\DigiCert\\DigiCert One Signing Manager Tools\\smctl.exe"
            $filePath = "target/windows_amd64/<< parameters.binary >>"
            $keypairAlias = $env:SM_KEYPAIR_ALIAS

            Write-Host "Signing $filePath with DigiCert KeyLocker..."

            & $smctlPath sign `
              --keypair-alias "$keypairAlias" `
              --input "$filePath" `
              --tool signtool `
              --verbose

            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Signing failed for $filePath"
              exit 1
            }

            Write-Host "Successfully signed: $filePath"
      - run:
          name: Export metadata variables for PowerShell/MSBuild
          shell: bash.exe -eo pipefail
          command: |
            echo "export SENSU_VERSION=$(cat target/version)" >> $BASH_ENV
            echo "export BUILD_NUMBER=$(cat target/build-number)" >> $BASH_ENV
            echo "export TARGET_REVISION=$(cat target/git-revision)" >> $BASH_ENV
            echo "export TARGET_BRANCH=$(cat target/git-branch)" >> $BASH_ENV

            source $BASH_ENV

            echo "SENSU_VERSION=$SENSU_VERSION"
      - build-msi:
          working_directory: wix/<< parameters.package_name >>
          arch: x86
      - build-msi:
          working_directory: wix/<< parameters.package_name >>
          arch: x64
      - run:
          name: Sign MSI packages with DigiCert
          shell: powershell.exe
          command: |
            $smctlPath = "C:\Program Files\DigiCert\DigiCert One Signing Manager Tools\smctl.exe"
            $keypairAlias = $env:SM_KEYPAIR_ALIAS

            $msiFiles = Get-ChildItem -Path dist/msi/en-US -Filter *.msi

            foreach ($msi in $msiFiles) {

              Write-Host "Signing $($msi.FullName) with DigiCert KeyLocker..."

              & $smctlPath sign `
                --keypair-alias "$keypairAlias" `
                --input "$($msi.FullName)" `
                --tool signtool `
                --verbose

              if ($LASTEXITCODE -ne 0) {
                Write-Host "ERROR: Signing failed for $($msi.FullName)"
                exit 1
              }

              Write-Host "Successfully signed: $($msi.FullName)"
            }
      - run:
          name: Copy << parameters.package_name >> MSIs to choco tools
          command: |
            cp dist/msi/en-US/*.msi choco/<< parameters.package_name >>/tools
      - run:
          name: Create choco package for << parameters.package_name >>
          working_directory: choco/<< parameters.package_name >>
          command: msbuild.exe
      - gather-artifacts:
          find_command: "/bin/find"
          filename: "*.msi"
          source: "choco/<< parameters.package_name >>/tools"
          destination: "c:/tmp/artifacts/s3/build/msi"
      - gather-artifacts:
          find_command: "/bin/find"
          filename: "*.nupkg"
          source: "choco/<< parameters.package_name >>"
          destination: "c:/tmp/artifacts/s3/build/nupkg"
      - gather-artifacts:
          find_command: "/bin/find"
          filename: "*.msi"
          source: "choco/<< parameters.package_name >>/tools"
          destination: "c:/tmp/artifacts/circleci"
      - gather-artifacts:
          find_command: "/bin/find"
          filename: "*.nupkg"
          source: "choco/<< parameters.package_name >>"
          destination: "c:/tmp/artifacts/circleci"
      - store_artifacts:
          path: "c:/tmp/artifacts/circleci"
          destination: "."
      - when:
          condition: << pipeline.parameters.publish >>
          steps:
            - run:
                name: Push nupkg to AppVeyor NuGet feed
                working_directory: choco/<< parameters.package_name >>
                command: >
                  nuget push *.nupkg -ApiKey $APPVEYOR_NUGET_API_KEY -Source
                  https://ci.appveyor.com/nuget/sensu-hjg205j7fvg1/api/v2/package
            - fetch-logs:
                binary: "circleci-logs.exe"
                destination: "c:/tmp/artifacts/s3/logs"
            - upload-artifacts-to-s3:
                find_command: "/bin/find"
                source: "c:/tmp/artifacts/s3"
  packagecloud-pruner:
    executor: packagecloud-pruner
    steps:
      - run: /tools/packagecloudpruner

workflows:
  packaging:
    jobs:
      - build-linux-packages:
          name: << matrix.target >>
          destination: target/<< matrix.target >>
          matrix:
            parameters:
              target:
                - linux_386
                - linux_amd64
                - linux_arm64
                - linux_arm_5
                - linux_arm_6
                - linux_arm_7
                - linux_mips_hardfloat
                - linux_mipsle_hardfloat
                #- linux_mips64le_hardfloat
                - linux_ppc64le
                - linux_s390x
      - build-windows-packages:
          name: windows_agent
          package_name: sensu-go-agent
          binary: sensu-agent.exe
      - build-windows-packages:
          name: windows_cli
          package_name: sensu-go-cli
          binary: sensuctl.exe
  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - packagecloud-pruner
